name: HotDrop rebuilt apps
on:
  workflow_dispatch:
  push:
    paths:
      - 'New HotDrop Apps/**'
      - '.github/workflows/hotdrop-rebuild.yml'
  pull_request:
    paths:
      - 'New HotDrop Apps/**'
      - '.github/workflows/hotdrop-rebuild.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: New HotDrop Apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies
        run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package is no longer published by Google.
          packages: 'platform-tools'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Generate Android scaffold
        working-directory: New HotDrop Apps/apps/mobile
        run: flutter create --no-pub --platforms=android --org com.hotdrop --project-name hotdrop_mobile .
      - run: node scripts/prepare-mobile.cjs
      - name: Resolve Flutter dependencies
        working-directory: New HotDrop Apps/apps/mobile
        run: flutter pub get
      - name: Analyze Android app
        working-directory: New HotDrop Apps/apps/mobile
        run: flutter analyze lib test
      - name: Test Android host and startup screen
        working-directory: New HotDrop Apps/apps/mobile
        run: flutter test --reporter expanded
      - name: Build installable test APK
        working-directory: New HotDrop Apps/apps/mobile
        run: flutter build apk --release --no-pub
      - name: Save Android build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HotDrop-Android-diagnostics
          path: |
            New HotDrop Apps/apps/mobile/pubspec.lock
            New HotDrop Apps/apps/mobile/build/reports/
            New HotDrop Apps/apps/mobile/android/app/build.gradle.kts
            New HotDrop Apps/apps/mobile/android/settings.gradle.kts
            New HotDrop Apps/apps/mobile/android/gradle/wrapper/gradle-wrapper.properties
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: HotDrop-Android-test
          path: New HotDrop Apps/apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
  android-smoke:
    name: Test installed Android APK
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: HotDrop-Android-test
          path: apk
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and exercise the release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node "New HotDrop Apps/scripts/android-smoke.cjs" "apk/app-release.apk"
      - name: Save phone-test logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HotDrop-Android-smoke-results
          path: android-smoke-results/
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: New HotDrop Apps
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build:desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: HotDrop-Windows
          path: New HotDrop Apps/dist-installers/HotDrop-Setup-*.exe
          if-no-files-found: error
