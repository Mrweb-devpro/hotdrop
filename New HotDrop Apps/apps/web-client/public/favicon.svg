<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="HotDrop logo">
  <rect width="100" height="100" rx="22" fill="#FACC15"/>
  <!-- WiFi arcs + HD mix: D forms the signal base, H is signal bars -->
  <!-- Outer arc -->
  <path d="M 18 46 A 45 45 0 0 1 82 46" fill="none" stroke="#18181B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Middle arc -->
  <path d="M 30 46 A 30 30 0 0 1 70 46" fill="none" stroke="#18181B" stroke-width="7" stroke-linecap="round"/>
  <!-- Inner arc -->
  <path d="M 40 46 A 17 17 0 0 1 60 46" fill="none" stroke="#18181B" stroke-width="7" stroke-linecap="round"/>
  <!-- Center dot = D's counter merged with WiFi dot -->
  <circle cx="50" cy="57" r="10" fill="#18181B"/>
  <circle cx="50" cy="57" r="4.5" fill="#FACC15"/>
  <!-- HD text integrated below - H as bars, D as rounded -->
  <g font-family="Inter, system-ui, sans-serif" font-weight="900" text-anchor="middle">
    <text x="32" y="84" font-size="26" fill="#18181B">H</text>
    <text x="68" y="84" font-size="26" fill="#18181B">D</text>
  </g>
</svg>
